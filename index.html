ize:12px;font-weight:700;color:#f5c542;margin:0">🧪 اشتراطات آمنة:</p>      <p style="font-size:11px;color:#eab308;line-height:1.8;margin:6px 0 0">روزماري 2% IFRA • عطور 1-2% • سالسليك 2% • pH حسب الوصفة</p>    </div>    <div style="display:grid;grid-template-columns:5fr 3fr 2fr 2fr;padding:8px 12px;background:#0a1931;border-radius:14px;font-size:10px;font-weight:700;color:#94a3b8;text-align:center">      <span style="text-align:right">المادة</span><span>1000جم</span><span>100جم</span><span>50جم</span>    </div>    ${r.ing.map(i=>`<div style="display:grid;grid-template-columns:5fr 3fr 2fr 2fr;padding:12px;background:#1e3a5f;border-radius:14px;border:1px solid rgba(255,255,255,.05);align-items:center">      <div><p style="font-size:12px;font-weight:700;margin:0;line-height:1.4">${i[0]}</p>${i[4]?`<p style="font-size:9px;color:#f5c542;margin:2px 0 0">${i[4]}</p>`:''}</div>      <span style="text-align:center;font-size:11px;font-weight:900;color:#f5c542;background:#0a1931;margin:0 4px;padding:4px 0;border-radius:999px">${i[1]}جم</span>      <span style="text-align:center;font-size:11px;font-weight:700">${i[2]}جم</span>      <span style="text-align:center;font-size:10px;color:#94a3b8;background:rgba(10,25,49,.5);padding:4px 0;border-radius:999px">${i[3]}جم</span>    </div>`).join("")}    <div style="border-radius:14px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:12px">      <p style="font-size:11px;margin:0 0 4px"><span style="color:#f5c542;font-weight:700">الصلاحية:</span> ${r.shelf}</p>      <p style="font-size:11px;margin:0"><span style="color:#f5c542;font-weight:700">التخزين:</span> ${r.store}</p>    </div>    <div style="border-radius:14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);padding:12px">      <p style="font-size:11px;color:#f87171;font-weight:700;margin:0 0 6px">⚠️ تحذيرات:</p>      ${r.warn.map(w=>`<p style="font-size:11px;color:rgba(248,113,113,.8);line-height:1.6;margin:2px 0 5">${r.cost}</p>        </div>        <div style="border-radius:16px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);padding:16px">          <p style="font-size:10px;color:#6ee7b7;margin:0">هامش الربح</p>          <p style="font-size:22px;font-weight:900;color:#34d399;margin:4px 0 0">${r.profit}</p>        </div>      </div>    </div>  </div>`;}function renderAdmin(){  return `  <div class="screen">    <div style="position:sticky;top:0;z-index:20;background:rgba(10,25,49,.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">      <div style="display:flex;align-items:center;gap:8px">        <div style="width:32px;height:32px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;color:#f5c542;font-size:14px">🧪</div>        <div><p style="font-size:12px;font-weight:700;margin:0">لوحة الأدمن 👑</p><p style="font-size:10px;color:#34d399;margin:2px 0 0">☁️ Firebase متصل</p></div>      </div>      <button id="btn-logout" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:none">✕</button>    </div>    <div style="padding:16px;display:flex;flex-direction:column;gap:16px">      <button id="btn-preview" style="width:100%;height:48px;border-radius:18px;background:#059669;color:#fff;font-weight:900;font-size:13px;border:none">معاينة الموسوعة 🧴 (20 وصفة)</button>      <div style="border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px">        <h3 style="font-size:14px;font-weight:700;margin:0">إضافة عميل جديد</h3>        <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">الكود يُشفّر SHA-256</p>        <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">          <div>            <label style="font-size:11px;color:#94a3b8">اسم العميل</label>            <input id="n-name" placeholder="مثال: أميرة محمد" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none"/>          </div>          <div>            <label style="font-size:11px;color:#94a3b8">رقم الموبايل</label>            <input id="n-phone" placeholder="01210910125" dir="ltr" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none;text-align:right"/>          </div>          <div>            <label style="font-size:11px;color:#94a3b8">كود الدخول (12 حرف)</label>            <div style="margin-top:4px;display:flex;gap:8px">              <input id="n-code" placeholder="PH-XXXXXXXXXXXX" style="flex:1;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none;letter-spacing:2px;font-weight:700"/>              <button id="btn-gen" style="height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:700">🔄 توليد</button>            </div>          </div>          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">            <div>              <label style="font-size:11px;color:#94a3b8">تاريخ الصلاحية</label>              <input id="n-exp" type="date" value="2027-09-09" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none"/>            </div>            <div>              <label style="font-size:11px;color:#94a3b8">عدد الأجهزة</label>              <select id="n-dev" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none">                <option value="1">جهاز واحد</option>                <option value="2">جهازان</option>                <option value="3">3 أجهزة</option>              </select>            </div>          </div>          <button id="btn-add" style="width:100%;height:48px;border-radius:999px;background:#f5c542;color:#0a1931;font-weight:900;font-size:13px;border:none;margin-top:8px">حفظ في Firebase ☁️</button>        </div>      </div>      <div style="border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px">        <div style="display:flex;justify-content:space-between;align-items:center">          <h3 style="font-size:13px;font-weight:700;margin:0">العملاء</h3>          <p style="font-size:10px;color:#34d399;margin:0">☁️ متزامن</p>        </div>        <div id="clients-list" style="margin-top:16px">${renderClientsList()}</div>      </div>      <div style="border-radius:16px;background:#0a1931;border:1px dashed rgba(255,255,255,.1);padding:12px;text-align:center">        <p style="font-size:11px;color:#64748b;margin:0">🔒 كل الأكواد مشفرة SHA-256 • Cosmo Lab © 2026</p>      </div>    </div>  </div>`;}function renderClientsList(){  if(!STATE.clients.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا يوجد عملاء بعد</p>';  return STATE.clients.map(c=>`    <div style="border-radius:14px;background:#0a1931;border:1px solid rgba(255,255,255,.05);padding:12px;margin-bottom:8px">      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">        <div>          <p style="font-size:12px;font-weight:700;margin:0">${c.name}</p>          <p style="font-size:11px;color:#94a3b8;margin:2px 0 0" dir="ltr">${c.phone}</p>        </div>        <div style="text-align:right">          <p style="font-size:10px;color:#94a3b8;margin:0">صلاحية: ${c.expiry}</p>          <p style="font-size:10px;color:#94a3b8;margin:2px 0 0">أجهزة: ${c.used||0}/${c.devices}</p>        </div>      </div>      ${c.codePlain?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">        <code style="flex:1;font-size:11px;font-family:monospace;color:#f5c542;background:#1e3a5f;padding:4px 8px;border-radius:999px;text-align:center">${c.codePlain}</code>        <button data-copy-client="${c.id}" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px">📋</button>      </div>`:''}      <div style="text-align:right">        <button data-del-client="${c.id}" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);font-size:12px">🗑</button>      </div>    </div>  `).join("");}function bindEvents(){  const $=id=>document.getElementById(id);  if($("btn-login"))$("btn-login").onclick=handleLogin;  if($("btn-eye"))$("btn-eye").onclick=()=>{    STATE.showPwd=!STATE.showPwd;    render();  };  if($("btn-logout"))$("btn-logout").onclick=logout;  if($("in-search"))$("in-search").oninput=e=>{STATE.search=e.target.value;document.getElementById("recipes-list").innerHTML=renderRecipesList();bindRecipeBtns();};  if($("btn-back"))$("btn-back").onclick=()=>go("dashboard");  if($("btn-copy"))$("btn-copy").onclick=()=>{navigator.clipboard.writeText(STATE.sel.t);toast("تم النسخ ✓")};  if($("btn-preview"))$("btn-preview").onclick=()=>go("dashboard",{user:STATE.user});  if($("btn-gen"))$("btn-gen").onclick=()=>{$("n-code").value=SEC.gen();};  if($("btn-add"))$("btn-add").onclick=handleAddClient;  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{STATE.cat=b.dataset.cat;render();});  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{STATE.tab=b.dataset.tab;render();});  bindRecipeBtns();  document.querySelectorAll("[data-del-client]").forEach(b=>b.onclick=()=>delClient(b.dataset.delClient));  document.querySelectorAll("[data-copy-client]").forEach(b=>b.onclick=()=>{    const c=STATE.clients.find(x=>x.id===b.dataset.copyClient);    if(c){navigator.clipboard.writeText(`الاسم: ${c.name}\nالموبايل: ${c.phone}\nالكود: ${c.codePlain}\nالصلاحية: ${c.expiry}`);toast("تم النسخ ✓");}  });}function bindRecipeBtns(){  document.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>{    const r=RECIPES.find(x=>x.id==b.dataset.recipe);    if(r)go("detail",{sel:r,tab:"ing"});  });}async function handleLogin(){  const name=SEC.clean(document.getElementById("in-name").value);  const code=SEC.clean(document.getElementById("in-code").value);  if(!name)return toast("اكتبي اسمك","err");  if(!code)return toast("اكتبي كود الدخول","err");  if(code==="admin123"||code.toLowerCase()==="admin"){    const u={role:"admin",name:name||"محمد نصر"};    SEC.sess(u,60);STATE.user=u;toast("أهلاً بك يا أدمن");go("admin");return;  }  try{    const hash=await SEC.hash(code);    const q=await COL.where("codeHash","==",hash).limit(1).get();    if(q.empty)return toast("الكود غير صحيح","err");    const d=q.docs[0];const client={id:d.id,...d.data()};    if(new Date(client.expiry)<new Date())return toast("منتهي الصلاحية","err");    if(client.deviceId&&client.deviceId!==SEC.dev())return toast("مربوط بجهاز آخر","err");    await d.ref.update({deviceId:SEC.dev(),used:(client.used||0)+1,lastLogin:new Date().toISOString()});    const u={role:"client",name:client.name,phone:client.phone,id:client.id};    SEC.sess(u,30);STATE.user=u;toast("أهلاً "+client.name);go("dashboard");  }catch(e){console.error(e);toast("خطأ في الاتصال","err");}}function logout(){SEC.out();STATE.user=null;go("login");}async function handleAddClient(){  const n=SEC.clean(document.getElementById("n-name").value);  const p=SEC.clean(document.getElementById("n-phone").value);  const c=SEC.clean(document.getElementById("n-code").value);  const e=document.getElementById("n-exp").value;  const d=parseInt(document.getElementById("n-dev").value);  if(!n||!p||!c)return toast("كملي كل البيانات","err");  if(!SEC.phone(p))return toast("رقم الموبايل غير صحيح","err");  try{    const hash=await SEC.hash(c);    const q=await COL.where("codeHash","==",hash).limit(1).get();    if(!q.empty)return toast("الكود مستخدم","err");    await COL.add({name:n,phone:p,codeHash:hash,codePlain:c,expiry:e,devices:d,used:0,deviceId:null,createdAt:new Date().toISOString()});    document.getElementById("n-name").value="";    document.getElementById("n-phone").value="";    document.getElementById("n-code").value="";    toast("تم إضافة العميل ✓");  }catch(e){console.error(e);toast("فشل الحفظ","err");}}async function delClient(id){  if(!confirm("متأكد من الحذف؟"))return;  try{await COL.doc(id).delete();toast("تم الحذف");}catch(e){toast("فشل الحذف","err");}}(function(){  const s=SEC.getSess();  if(s){STATE.user=s.u;STATE.screen=s.u.role==="admin"?"admin":"dashboard";}  else STATE.screen="login";  render();})();</script></body></html>

function toast(msg,type="ok"){

  let el=document.getElementById("toast");

  if(el)el.remove();

  el=document.createElement("div");

  el.id="toast";

  el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.4);"+(type==="err"?"background:#ef4444;color:#fff":"background:#f5c542;color:#0a1931");

  el.textContent=msg;

  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2500);

}



function go(screen,data){

  if(STATE.unsub){STATE.unsub();STATE.unsub=null}

  STATE.screen=screen;

  if(data)Object.assign(STATE,data);

  render();

  window.scrollTo(0,0);

}



function render(){
  const app=document.getElementById("app");
  if(STATE.screen==="login")app.innerHTML=renderLogin();
  else if(STATE.screen==="dashboard")app.innerHTML=renderDashboard();
 
  if(STATE.screen==="detail")app.innerHTML=renderDetail();
  

  else if(STATE.screen==="admin"){app.innerHTML=renderAdmin();startClientsSync();startAllCustomSync();}
  else if(STATE.screen==="addRecipe")app.innerHTML=renderAddRecipe();
  else if(STATE.screen==="customerRecipes")app.innerHTML=renderCustomerRecipesScreen();
  addWhatsApp();
  if(STATE.screen!=="login")addScrollBtns();
  if(STATE.screen==="dashboard"&&STATE.user&&STATE.user.role==="client")startCustomSync();
  bindEvents();
}

function addScrollBtns(){
  var oldUp=document.getElementById("scroll-up");
  if(oldUp)oldUp.remove();
  var oldDn=document.getElementById("scroll-down");
  if(oldDn)oldDn.remove();
  
  var up=document.createElement("button");
  up.id="scroll-up";
  up.innerHTML="▲";
  up.style.cssText="position:fixed;bottom:20px;right:20px;z-index:98;width:48px;height:48px;border-radius:50%;background:rgba(245,197,66,.35);border:1px solid rgba(245,197,66,.4);color:#f5c542;font-size:22px;font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(245,197,66,.15);cursor:pointer;padding:0;line-height:1;opacity:0;transition:opacity .3s;backdrop-filter:blur(10px)";
  up.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
  document.body.appendChild(up);
  
  var dn=document.createElement("button");
  dn.id="scroll-down";
  dn.innerHTML="▼";
  dn.style.cssText="position:fixed;bottom:20px;left:20px;z-index:98;width:48px;height:48px;border-radius:50%;background:rgba(245,197,66,.35);border:1px solid rgba(245,197,66,.4);color:#f5c542;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(245,197,66,.15);cursor:pointer;padding:0;line-height:1;opacity:1;transition:opacity .3s;backdrop-filter:blur(10px)";
  dn.onclick=function(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
  document.body.appendChild(dn);
  
  if(window._scrollHandler) window.removeEventListener("scroll",window._scrollHandler);
  window._scrollHandler=function(){
    var y=window.scrollY||window.pageYOffset||0;
    var h=document.documentElement.scrollHeight-window.innerHeight;
    if(y>150){up.style.display="flex";up.style.opacity="1";}else{up.style.opacity="0";setTimeout(function(){if(up.style.opacity==="0")up.style.display="none";},300);}
    if(y>=h-150){dn.style.opacity="0";setTimeout(function(){if(dn.style.opacity==="0")dn.style.display="none";},300);}else{dn.style.display="flex";dn.style.opacity="1";}
  };
  window.addEventListener("scroll",window._scrollHandler);
  window._scrollHandler();
}

function getCatCount(catId){
  var limit=(STATE.user&&STATE.user.plan==="basic")?100:200;
  var customs=CUSTOM_RECIPES||[];
  if(catId==="all")return RECIPES.filter(function(r){return r.id<=limit;}).length+customs.length;
  if(catId==="fav")return 0;
  if(catId==="custom")return customs.length;
  return RECIPES.filter(function(r){return r.id<=limit&&r.c===catId;}).length+customs.filter(function(r){return r.c===catId;}).length;
}

async function saveCustomRecipe(){

  var ings=ingText.split("\n").filter(function(x){return x.trim();}).map(function(x){var m=x.match(/^(.+?)[\s\-:,=\t]+(\d+(?:\.\d+)?)\s*(جم|جرام|جرامات|g|مل|ml)?[\s\-:,=\t]*(.*)$/i);var nm=m?m[1].trim():x.trim();var qty=m?parseFloat(m[2]):0;var note=m&&m[4]?m[4].trim():"";var v100=qty?Math.round(qty*10)/100:"-";var v50=qty?Math.round(qty*5)/100:"-";return {name:nm,g1000:qty?String(qty):"-",g100:qty?String(v100):"-",g50:qty?String(v50):"-",note:note};});

}

function renderClientsList(){
  if(!STATE.clients.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا يوجد عملاء بعد</p>';
  var search=STATE.clientSearch.toLowerCase().trim();
  var filtered=STATE.clients.filter(function(c){
    if(!search)return true;
    return c.name.toLowerCase().includes(search)||c.phone.includes(search)||(c.codePlain||"").toLowerCase().includes(search);
  });
  if(!filtered.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا نتائج</p>';
  var perPage=4;
  var totalPages=Math.ceil(filtered.length/perPage);
  var page=Math.min(STATE.clientPage||0,totalPages-1);
  var start=page*perPage;
  var pageItems=filtered.slice(start,start+perPage);
  var html=pageItems.map(function(c){
    return '<div style="border-radius:14px;background:#0a1931;border:1px solid rgba(255,255,255,.05);padding:12px;margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div><p style="font-size:12px;font-weight:700;margin:0">'+c.name+'</p><p style="font-size:11px;color:#94a3b8;margin:2px 0 0" dir="ltr">'+c.phone+'</p></div>'+
     '<div style="text-align:right"><p style="font-size:10px;color:#94a3b8;margin:0">صلاحية: '+c.expiry+'</p><p style="font-size:10px;color:'+(c.plan==="basic"?"#94a3b8":"#f5c542")+';margin:2px 0 0">'+(c.plan==="basic"?"🥉 أساسية":"🥇 احترافية")+'</p></div>'+
    '</div>'+
    (c.codePlain?'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><code style="flex:1;font-size:11px;font-family:monospace;color:#f5c542;background:#1e3a5f;padding:4px 8px;border-radius:999px;text-align:center">'+c.codePlain+'</code><button onclick="event.stopPropagation();copyClientInfo(\''+c.id+'\')" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;cursor:pointer">📋</button></div>':'')+
    '<div style="display:flex;justify-content:flex-end;gap:6px">'+
      '<button onclick="event.stopPropagation();renewClient(\''+c.id+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(245,197,66,.15);color:#f5c542;border:1px solid rgba(245,197,66,.3);font-size:12px;cursor:pointer">🔄</button>'+
      '<button onclick="event.stopPropagation();changePlan(\''+c.id+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);font-size:12px;cursor:pointer">💎</button>'+
      '<button data-del-client="'+c.id+'" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);font-size:12px">🗑</button>'+
    '</div>'+
    '</div>';
  }).join("");
  if(totalPages>1){
    html+='<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px">'+
    '<button onclick="goClientPage(\'prev\')" style="height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer">السابق</button>'+
    '<span style="font-size:11px;color:#94a3b8">'+(page+1)+' / '+totalPages+'</span>'+
    '<button onclick="goClientPage(\'next\')" style="height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer">التالي</button>'+
    '</div>';
  }
  return html;
}


function exportToExcel(){
  if(!STATE.clients||!STATE.clients.length){toast("لا يوجد عملاء","err");return;}
  var csv="الاسم,الموبايل,الكود,الصلاحية,عدد الاجهزة,المستخدم,تاريخ الانشاء\n";
  STATE.clients.forEach(function(c){
    csv+='"'+c.name+'","'+c.phone+'","'+(c.codePlain||"")+'","'+c.expiry+'","'+c.devices+'","'+(c.used||0)+'","'+(c.createdAt||"").slice(0,10)+'"\n';
  });
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="cosmo-lab-clients-"+Date.now()+".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  toast("تم تصدير ملف Excel ✓");
}

function getFavsKey(){var u=STATE.user||{};return "cosmo_favs_"+(u.id||"guest");}
function getFavs(){try{return JSON.parse(localStorage.getItem(getFavsKey())||"[]");}catch(e){return[];}}
function isFav(id){return getFavs().indexOf(id)>-1;}
function toggleFav(id){var favs=getFavs();var idx=favs.indexOf(id);if(idx>-1){favs.splice(idx,1);toast("اتشالت من المفضلة");}else{favs.push(id);toast("اتضافت للمفضلة ❤️");}localStorage.setItem(getFavsKey(),JSON.stringify(favs));render();}

function updateStats(){
  var total=STATE.clients.length;
  var now=new Date();
  var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  var active=0,expired=0,devices=0,newThisMonth=0;
  STATE.clients.forEach(function(c){
    var exp=new Date(c.expiry);
    if(exp>=now)active++;else expired++;
    devices+=(c.used||0);
    if(c.createdAt){var cDate=new Date(c.createdAt);if(cDate>=monthStart)newThisMonth++;}
  });
  var el1=document.getElementById("stat-total");if(el1)el1.textContent=total;
  var el2=document.getElementById("stat-active");if(el2)el2.textContent=active;
  var el3=document.getElementById("stat-expired");if(el3)el3.textContent=expired;
  var el4=document.getElementById("stat-devices");if(el4)el4.textContent=devices;
  var el5=document.getElementById("stat-new");if(el5)el5.textContent=newThisMonth;
}

function goClientPage(dir){
  var search=(STATE.clientSearch||"").toLowerCase().trim();
  var filtered=STATE.clients.filter(function(c){
    if(!search)return true;
    return c.name.toLowerCase().includes(search)||c.phone.includes(search)||(c.codePlain||"").toLowerCase().includes(search);
  });
  var totalPages=Math.max(1,Math.ceil(filtered.length/4));
  if(dir==="prev")STATE.clientPage=Math.max(0,(STATE.clientPage||0)-1);
  else STATE.clientPage=Math.min(totalPages-1,(STATE.clientPage||0)+1);
  var list=document.getElementById("clients-list");
  if(list){list.innerHTML=renderClientsList();bindClientBtns();}
}

function copyClientInfo(id){var c=STATE.clients.find(function(x){return x.id===id;});if(!c)return;var txt="👤 الاسم: "+c.name+"\n📱 الموبايل: "+c.phone+"\n🔑 الكود: "+(c.codePlain||"")+"\n📅 الصلاحية: "+c.expiry+"\n💻 الأجهزة: "+(c.used||0)+"/"+c.devices+"\n\n🏭 Cosmo Lab";var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);try{document.execCommand("copy");toast("تم نسخ بيانات العميل ✓");}catch(e){toast("فشل النسخ","err");}document.body.removeChild(ta);}

function bindRecipeBtns(){
  document.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>{
    var id=b.dataset.recipe;
    var r=RECIPES.find(function(x){return String(x.id)===String(id);});
    if(!r&&typeof CUSTOM_RECIPES!=="undefined"){r=CUSTOM_RECIPES.find(function(x){return String(x.id)===String(id);});}
    if(r)go("detail",{sel:r,tab:"ing"});
  });
}



async function handleLogin(){

CUSTOM_RECIPES=[];

  const name=SEC.clean(document.getElementById("in-name").value);

  const code=SEC.clean(document.getElementById("in-code").value);

  if(!name)return toast("اكتبي اسمك","err");

if(!document.getElementById("terms-check")?.checked)return toast("لازم توافقي على شروط الاستخدام","err");

  if(!code)return toast("اكتبي كود الدخول","err");

  if(code==="admin123"||code.toLowerCase()==="admin"){

    const u={role:"admin",name:name||"محمد نصر"};

    SEC.sess(u,60);STATE.user=u;toast("أهلاً بك يا أدمن");go("admin");return;

  }

  try{

    const hash=await SEC.hash(code);

    const q=await COL.where("codeHash","==",hash).limit(1).get();

    if(q.empty)return toast("الكود غير صحيح","err");

    const d=q.docs[0];const client={id:d.id,...d.data()};

    if(new Date(client.expiry)<new Date())return toast("منتهي الصلاحية","err");

    if(client.deviceId&&client.deviceId!==SEC.dev())return toast("مربوط بجهاز آخر","err");

    await d.ref.update({deviceId:SEC.dev(),used:(client.used||0)+1,lastLogin:new Date().toISOString()});

   const u={role:"client",name:client.name,phone:client.phone,id:client.id,plan:client.plan||"pro"};

    SEC.sess(u,30);STATE.user=u;toast("أهلاً "+client.name);go("dashboard");

  }catch(e){console.error(e);toast("خطأ في الاتصال","err");}

}



function logout(){SEC.out();STATE.user=null;go("login");}



async function handleAddClient(){

  const n=SEC.clean(document.getElementById("n-name").value);

  const p=SEC.clean(document.getElementById("n-phone").value);

  const c=SEC.clean(document.getElementById("n-code").value);

  const e=document.getElementById("n-exp").value;

  const d=parseInt(document.getElementById("n-dev").value);
  const plan=document.getElementById("n-plan").value;

  if(!n||!p||!c)return toast("كملي كل البيانات","err");

  if(!SEC.phone(p))return toast("رقم الموبايل غير صحيح","err");

  try{

    const hash=await SEC.hash(c);

    const q=await COL.where("codeHash","==",hash).limit(1).get();

    if(!q.empty)return toast("الكود مستخدم","err");

 await COL.add({name:n,phone:p,codeHash:hash,codePlain:c,expiry:e,devices:d,plan:plan,used:0,deviceId:null,createdAt:new Date().toISOString()});

    document.getElementById("n-name").value="";

    document.getElementById("n-phone").value="";

    document.getElementById("n-code").value="";

    toast("تم إضافة العميل ✓");

  }catch(e){console.error(e);toast("فشل الحفظ","err");}

}

async function changePlan(id){
  var client=STATE.clients.find(function(c){return c.id===id;});
  if(!client)return;
  var current=client.plan||"pro";
  var newPlan=current==="basic"?"pro":"basic";
  var confirmMsg="تغيير باقة "+client.name+" من\n"+(current==="basic"?"🥉 أساسية":"🥇 احترافية")+"\nإلى\n"+(newPlan==="basic"?"🥉 أساسية":"🥇 احترافية")+"؟";
  if(!confirm(confirmMsg))return;
  try{
    await COL.doc(id).update({plan:newPlan});
    toast("تم تغيير الباقة ✓");
  }catch(e){console.error(e);toast("فشل التغيير","err");}
}
async function renewClient(id){
  var client=STATE.clients.find(function(c){return c.id===id;});
  if(!client)return;
  var newExp=prompt("📅 تاريخ الصلاحية الجديد للعميل: "+client.name+"\n\n(اكتبي بصيغة YYYY-MM-DD)\n\nالتاريخ الحالي: "+client.expiry,client.expiry);
  if(!newExp)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newExp)){toast("صيغة التاريخ غلط - استخدمي YYYY-MM-DD","err");return;}
  try{
    await COL.doc(id).update({expiry:newExp});
    toast("تم تجديد الصلاحية ✓");
  }catch(e){console.error(e);toast("فشل التجديد","err");}
}

async function delClient(id){

  if(!confirm("متأكد من الحذف؟"))return;

  try{await COL.doc(id).delete();toast("تم الحذف");}catch(e){toast("فشل الحذف","err");}

}

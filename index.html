let STATE={screen:"login",user:null,search:"",cat:"all",sel:null,tab:"ing",clients:[],unsub:null,showPwd:false};

function toast(msg,type="ok"){
  let el=document.getElementById("toast");
  if(el)el.remove();
  el=document.createElement("div");
  el.id="toast";
  el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.4);"+(type==="err"?"background:#ef4444;color:#fff":"background:#f5c542;color:#0a1931");
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

function go(screen,data){
  if(STATE.unsub){STATE.unsub();STATE.unsub=null}
  STATE.screen=screen;
  if(data)Object.assign(STATE,data);
  render();
  window.scrollTo(0,0);
}

function render(){
  const app=document.getElementById("app");
  if(STATE.screen==="login")app.innerHTML=renderLogin();
  else if(STATE.screen==="dashboard")app.innerHTML=renderDashboard();
  else if(STATE.screen==="detail")app.innerHTML=renderDetail();
  else if(STATE.screen==="admin"){app.innerHTML=renderAdmin();startClientsSync();}
  bindEvents();
}

function startClientsSync(){
  if(STATE.unsub)return;
  STATE.unsub=COL.orderBy("createdAt","desc").onSnapshot(snap=>{
    STATE.clients=[];
    snap.forEach(d=>STATE.clients.push({id:d.id,...d.data()}));
    const list=document.getElementById("clients-list");
    if(list)list.innerHTML=renderClientsList();
  },err=>console.error(err));
}

function renderRecipesList(){
  const s=STATE.search.trim().toLowerCase();
  const filtered=RECIPES.filter(r=>{
    const okCat=STATE.cat==="all"||r.c===STATE.cat;
    const okS=!s||r.t.toLowerCase().includes(s)||r.d.toLowerCase().includes(s)||r.ing.some(i=>i[0].includes(s));
    return okCat&&okS;
  });
  if(!filtered.length)return '<p style="text-align:center;color:#64748b;padding:40px 0;font-size:13px">لا نتائج</p>';
  return filtered.map(r=>`
    <button data-recipe="${r.id}" style="width:100%;text-align:right;border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:10px;padding:4px 10px;border-radius:999px;background:#0a1931;border:1px solid rgba(255,255,255,.1);color:#94a3b8">${r.cat}</span>
        <span style="font-size:10px;color:#64748b">تركيبة ${r.id} • ${r.es}</span>
      </div>
      <h3 style="font-size:14px;font-weight:700;margin:0;line-height:1.6">${r.t}</h3>
      <p style="font-size:11px;color:#94a3b8;margin:0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${r.d}</p>
      <div style="display:flex;gap:8px;margin-top:4px">
        <span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)">ربح ${r.profit}</span>
        <span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.05);color:#94a3b8">${r.cost}</span>
      </div>
    </button>
  `).join("");
}

  <div class="screen">
    <div style="position:sticky;top:0;z-index:20;background:rgba(10,25,49,.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">

      <div style="display:flex;gap:8px">
        <span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(245,197,66,.15);color:#f5c542;border:1px solid rgba(245,197,66,.2)">COSMO LAB</span>
        <span style="font-size:11px;padding:4px 10px;border-radius:999px;background:#1e3a5f;border:1px solid rgba(255,255,255,.1)">${r.cat}</span>
      </div>
      <button id="btn-copy" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff">📋</button>
    </div>

      <span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(245,197,66,.15);color:#f5c542;border:1px solid rgba(245,197,66,.2)">${r.es} • ${r.iso} • تركيبة ${r.id}</span>
      <h1 style="font-size:20px;font-weight:900;line-height:1.6;margin:12px 0 8px">${r.t}</h1>
      <p style="font-size:12px;color:#94a3b8;line-height:1.7;margin:0">${r.d}</p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:20px;padding:4px;border-radius:999px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05)">
        ${tabs.map(t=>`<button data-tab="${t.k}" style="height:36px;border-radius:999px;border:none;font-size:11px;font-weight:700;${t.k===STATE.tab?'background:#f5c542;color:#0a1931':'background:transparent;color:#94a3b8'}">${t.l}</button>`).join("")}
      </div>
      ${STATE.tab==="ing"?renderIngredients(r):STATE.tab==="tools"?renderTools(r):STATE.tab==="steps"?renderSteps(r):renderCost(r)}
    </div>
  </div>`;
}

function renderIngredients(r){
  return `<div style="margin-top:20px;display:flex;flex-direction:column;gap:16px">
    <div style="border-radius:16px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.2);padding:16px">

      <p style="font-size:11px;color:#eab308;line-height:1.8;margin:6px 0 0">روزماري 2% IFRA • عطور 1-2% • سالسليك 2% • pH حسب الوصفة</p>
    </div>
    <div style="display:grid;grid-template-columns:5fr 3fr 2fr 2fr;padding:8px 12px;background:#0a1931;border-radius:14px;font-size:10px;font-weight:700;color:#94a3b8;text-align:center">

      <span style="text-align:center;font-size:11px;font-weight:900;color:#f5c542;background:#0a1931;margin:0 4px;padding:4px 0;border-radius:999px">${i[1]}جم</span>

      <div style="width:28px;height:28px;border-radius:50%;background:#f5c542;color:#0a1931;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0">${i+1}</div>

          <p style="font-size:10px;color:#6ee7b7;margin:0">هامش الربح</p>

  return `
  <div class="screen">
    <div style="position:sticky;top:0;z-index:20;background:rgba(10,25,49,.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:32px;height:32px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;color:#f5c542;font-size:14px">🧪</div>
        <div><p style="font-size:12px;font-weight:700;margin:0">لوحة الأدمن 👑</p><p style="font-size:10px;color:#34d399;margin:2px 0 0">☁️ Firebase متصل</p></div>
      </div>
      <button id="btn-logout" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:none">✕</button>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:16px">

      <div style="border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px">
        <h3 style="font-size:14px;font-weight:700;margin:0">إضافة عميل جديد</h3>
        <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">الكود يُشفّر SHA-256</p>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
          <div>
            <label style="font-size:11px;color:#94a3b8">اسم العميل</label>
            <input id="n-name" placeholder="مثال: أميرة محمد" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none"/>
          </div>
          <div>
            <label style="font-size:11px;color:#94a3b8">رقم الموبايل</label>
            <input id="n-phone" placeholder="01210910125" dir="ltr" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none;text-align:right"/>
          </div>
          <div>
            <label style="font-size:11px;color:#94a3b8">كود الدخول (12 حرف)</label>
            <div style="margin-top:4px;display:flex;gap:8px">
              <input id="n-code" placeholder="PH-XXXXXXXXXXXX" style="flex:1;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none;letter-spacing:2px;font-weight:700"/>
              <button id="btn-gen" style="height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:700">🔄 توليد</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label style="font-size:11px;color:#94a3b8">تاريخ الصلاحية</label>
              <input id="n-exp" type="date" value="2027-09-09" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none"/>
            </div>
            <div>
              <label style="font-size:11px;color:#94a3b8">عدد الأجهزة</label>
              <select id="n-dev" style="margin-top:4px;width:100%;height:44px;border-radius:12px;background:#0a1931;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:13px;color:#fff;outline:none">
                <option value="1">جهاز واحد</option>
                <option value="2">جهازان</option>
                <option value="3">3 أجهزة</option>
              </select>
            </div>
          </div>
          <button id="btn-add" style="width:100%;height:48px;border-radius:999px;background:#f5c542;color:#0a1931;font-weight:900;font-size:13px;border:none;margin-top:8px">حفظ في Firebase ☁️</button>
        </div>
      </div>
      <div style="border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 style="font-size:13px;font-weight:700;margin:0">العملاء</h3>
          <p style="font-size:10px;color:#34d399;margin:0">☁️ متزامن</p>
        </div>
        <div id="clients-list" style="margin-top:16px">${renderClientsList()}</div>
      </div>
      <div style="border-radius:16px;background:#0a1931;border:1px dashed rgba(255,255,255,.1);padding:12px;text-align:center">
        <p style="font-size:11px;color:#64748b;margin:0">🔒 كل الأكواد مشفرة SHA-256 • Cosmo Lab © 2026</p>

function renderClientsList(){
  if(!STATE.clients.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا يوجد عملاء بعد</p>';
  return STATE.clients.map(c=>`
    <div style="border-radius:14px;background:#0a1931;border:1px solid rgba(255,255,255,.05);padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <p style="font-size:12px;font-weight:700;margin:0">${c.name}</p>
          <p style="font-size:11px;color:#94a3b8;margin:2px 0 0" dir="ltr">${c.phone}</p>
        </div>
        <div style="text-align:right">
          <p style="font-size:10px;color:#94a3b8;margin:0">صلاحية: ${c.expiry}</p>
          <p style="font-size:10px;color:#94a3b8;margin:2px 0 0">أجهزة: ${c.used||0}/${c.devices}</p>
        </div>
      </div>
      ${c.codePlain?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <code style="flex:1;font-size:11px;font-family:monospace;color:#f5c542;background:#1e3a5f;padding:4px 8px;border-radius:999px;text-align:center">${c.codePlain}</code>
        <button data-copy-client="${c.id}" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px">📋</button>
      </div>`:''}
      <div style="text-align:right">
        <button data-del-client="${c.id}" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);font-size:12px">🗑</button>
      </div>
    </div>
  `).join("");
}

function bindEvents(){
  const $=id=>document.getElementById(id);
  if($("btn-login"))$("btn-login").onclick=handleLogin;
  if($("btn-eye"))$("btn-eye").onclick=()=>{
    STATE.showPwd=!STATE.showPwd;
    render();
  };
  if($("btn-logout"))$("btn-logout").onclick=logout;
  if($("in-search"))$("in-search").oninput=e=>{STATE.search=e.target.value;document.getElementById("recipes-list").innerHTML=renderRecipesList();bindRecipeBtns();};
  if($("btn-back"))$("btn-back").onclick=()=>go("dashboard");
  if($("btn-copy"))$("btn-copy").onclick=()=>{navigator.clipboard.writeText(STATE.sel.t);toast("تم النسخ ✓")};
  if($("btn-preview"))$("btn-preview").onclick=()=>go("dashboard",{user:STATE.user});
  if($("btn-gen"))$("btn-gen").onclick=()=>{$("n-code").value=SEC.gen();};
  if($("btn-add"))$("btn-add").onclick=handleAddClient;
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{STATE.cat=b.dataset.cat;render();});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{STATE.tab=b.dataset.tab;render();});
  bindRecipeBtns();
  document.querySelectorAll("[data-del-client]").forEach(b=>b.onclick=()=>delClient(b.dataset.delClient));
  document.querySelectorAll("[data-copy-client]").forEach(b=>b.onclick=()=>{
    const c=STATE.clients.find(x=>x.id===b.dataset.copyClient);
    if(c){navigator.clipboard.writeText(`الاسم: ${c.name}\nالموبايل: ${c.phone}\nالكود: ${c.codePlain}\nالصلاحية: ${c.expiry}`);toast("تم النسخ ✓");}
  });
}

function bindRecipeBtns(){
  document.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>{
    const r=RECIPES.find(x=>x.id==b.dataset.recipe);
    if(r)go("detail",{sel:r,tab:"ing"});
  });
}

async function handleLogin(){
  const name=SEC.clean(document.getElementById("in-name").value);
  const code=SEC.clean(document.getElementById("in-code").value);
  if(!name)return toast("اكتبي اسمك","err");
  if(!code)return toast("اكتبي كود الدخول","err");
  if(code==="admin123"||code.toLowerCase()==="admin"){
    const u={role:"admin",name:name||"محمد نصر"};
    SEC.sess(u,60);STATE.user=u;toast("أهلاً بك يا أدمن");go("admin");return;
  }
  try{
    const hash=await SEC.hash(code);
    const q=await COL.where("codeHash","==",hash).limit(1).get();
    if(q.empty)return toast("الكود غير صحيح","err");
    const d=q.docs[0];const client={id:d.id,...d.data()};
    if(new Date(client.expiry)<new Date())return toast("منتهي الصلاحية","err");
    if(client.deviceId&&client.deviceId!==SEC.dev())return toast("مربوط بجهاز آخر","err");
    await d.ref.update({deviceId:SEC.dev(),used:(client.used||0)+1,lastLogin:new Date().toISOString()});
    const u={role:"client",name:client.name,phone:client.phone,id:client.id};
    SEC.sess(u,30);STATE.user=u;toast("أهلاً "+client.name);go("dashboard");
  }catch(e){console.error(e);toast("خطأ في الاتصال","err");}
}

function logout(){SEC.out();STATE.user=null;go("login");}

async function handleAddClient(){
  const n=SEC.clean(document.getElementById("n-name").value);
  const p=SEC.clean(document.getElementById("n-phone").value);
  const c=SEC.clean(document.getElementById("n-code").value);
  const e=document.getElementById("n-exp").value;
  const d=parseInt(document.getElementById("n-dev").value);
  if(!n||!p||!c)return toast("كملي كل البيانات","err");
  if(!SEC.phone(p))return toast("رقم الموبايل غير صحيح","err");
  try{
    const hash=await SEC.hash(c);
    const q=await COL.where("codeHash","==",hash).limit(1).get();
    if(!q.empty)return toast("الكود مستخدم","err");
    await COL.add({name:n,phone:p,codeHash:hash,codePlain:c,expiry:e,devices:d,used:0,deviceId:null,createdAt:new Date().toISOString()});
    document.getElementById("n-name").value="";
    document.getElementById("n-phone").value="";
    document.getElementById("n-code").value="";
    toast("تم إضافة العميل ✓");
  }catch(e){console.error(e);toast("فشل الحفظ","err");}
}

async function delClient(id){
  if(!confirm("متأكد من الحذف؟"))return;
  try{await COL.doc(id).delete();toast("تم الحذف");}catch(e){toast("فشل الحذف","err");}
}

(function(){
  const s=SEC.getSess();
  if(s){STATE.user=s.u;STATE.screen=s.u.role==="admin"?"admin":"dashboard";}
  else STATE.screen="login";
  render();
})();
</script>
</body>
